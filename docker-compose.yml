services:
  # ==========================================
  # CodeSentinel Core Application Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: codesentinel_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - PROJECT_NAME=CodeSentinel
      - SECRET_KEY=codesentinel-insecure-dev-secret-key-change-in-production-123456
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=codesentinel
      - POSTGRES_PASSWORD=codesentinel_secret
      - POSTGRES_DB=codesentinel_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=codesentinel_graph_secret
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend/app:/app/backend/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - codesentinel_app_net

  # ==========================================
  # Background Worker Daemon
  # ==========================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: codesentinel_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=codesentinel
      - POSTGRES_PASSWORD=codesentinel_secret
      - POSTGRES_DB=codesentinel_db
    volumes:
      - ./backend/app:/app/backend/app
      - ./shared:/app/shared
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - codesentinel_app_net

  # ==========================================
  # Frontend User Interface (React + Vite)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesentinel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - codesentinel_app_net

  # ==========================================
  # PostgreSQL (Primary Relational Store)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: codesentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel_secret
      POSTGRES_DB: codesentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel -d codesentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codesentinel_app_net

  # ==========================================
  # Neo4j (Knowledge Graph Relationships Only)
  # ==========================================
  neo4j:
    image: neo4j:5.21.0-community
    container_name: codesentinel_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/codesentinel_graph_secret
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - codesentinel_app_net

  # ==========================================
  # Qdrant (Vector Database / RAG)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: codesentinel_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - codesentinel_app_net

  # ==========================================
  # Redis (Job Queue & Cache)
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: codesentinel_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codesentinel_app_net

# Dedicated Application Network (Isolated from Phase 4 Sandbox Infra)
networks:
  codesentinel_app_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
